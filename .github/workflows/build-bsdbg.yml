name: Build bsdbg (Unix)

# Builds the ButterscotchDbg embedded runner for Linux and macOS with
# tools/build-bsdbg.sh and uploads the staged runtimes. Windows is covered by
# tools/build-bsdbg.ps1 in the Publish GUI workflow.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ButterscotchDbg/**'
      - 'Butterscotch/**'
      - 'tools/build-bsdbg.sh'
      - '.github/workflows/build-bsdbg.yml'
  pull_request:
    paths:
      - 'ButterscotchDbg/**'
      - 'Butterscotch/**'
      - 'tools/build-bsdbg.sh'
      - '.github/workflows/build-bsdbg.yml'

jobs:
  build:
    name: Build (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build on the oldest supported Ubuntu so the resulting .so runs on
          # distributions with an older glibc than the runner image.
          - os: ubuntu-22.04
            rid: linux-x64
          - os: macos-13
            rid: osx-x64
          - os: macos-14
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev

      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2

      - name: Build bsdbg
        run: ./tools/build-bsdbg.sh --backend sdl2 --clean

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: bsdbg-${{ matrix.rid }}
          path: UndertaleModRunner/native/${{ matrix.rid }}/*
          if-no-files-found: error

  build-android:
    name: Build (android-arm64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # Pinned to r27c to match the toolchain the runtimes are built with locally.
      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Build bsdbg
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: ./tools/build-bsdbg-android.sh --abi arm64-v8a --clean

      - name: Upload runtime
        uses: actions/upload-artifact@v4
        with:
          name: bsdbg-android-arm64
          path: UndertaleModRunner/native/android-arm64/*
          if-no-files-found: error
