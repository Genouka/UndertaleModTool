name: MirrorChyan release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable release tag (empty for the latest stable release)'
        default: ''
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: mirrorchyan-release-${{ inputs.tag || 'latest' }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Resolve stable release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: Genouka/UndertaleModTool
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [[ -n "$REQUESTED_TAG" ]]; then
            args+=("$REQUESTED_TAG")
          fi
          release=$(gh release view "${args[@]}" --json tagName,isDraft,isPrerelease)
          if [[ $(jq -r '.isDraft or .isPrerelease' <<< "$release") != false ]]; then
            echo "::error::Only published stable releases are supported."
            exit 1
          fi
          echo "tag=$(jq -r '.tagName' <<< "$release")" >> "$GITHUB_OUTPUT"

  mirrorchyan:
    if: ${{ github.repository_owner == 'Genouka' }}
    needs: resolve
    name: ${{ matrix.rid }} (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: UndertaleModTool-Genouka
            os: win
            arch: x64
            filename: 'UndertaleModTool_*-Windows.zip'
          - rid: UndertaleModToolSingleFile-Genouka
            os: win
            arch: x64
            filename: 'UndertaleModTool_*-Windows-SingleFile.zip'
          - rid: UndertaleModToolAvalonia-Genouka
            os: win
            arch: x64
            filename: 'UndertaleModToolAvalonia_*-Windows.zip'
          - rid: UndertaleModToolAvalonia-Genouka
            os: linux
            arch: x64
            filename: 'UndertaleModToolAvalonia_*-Linux.zip'
          - rid: UndertaleModToolAvalonia-Genouka
            os: macos
            arch: arm64
            filename: 'UndertaleModToolAvalonia_*-macOS.zip'
          - rid: UndertaleModToolAvalonia-Genouka
            os: macos
            arch: x64
            filename: 'UndertaleModToolAvalonia_*-macOS-x86.zip'
          - rid: UndertaleModToolAvalonia-Genouka
            os: android
            arch: arm64
            filename: 'UndertaleModToolAvalonia_*-Android-arm64.zip'
          - rid: UndertaleModToolAvalonia-Genouka
            os: android
            arch: x64
            filename: 'UndertaleModToolAvalonia_*-Android-x64.zip'
          - rid: UndertaleModCli-Genouka
            os: win
            arch: x64
            filename: 'UTMT_CLI_*-Windows.zip'
          - rid: UndertaleModCli-Genouka
            os: linux
            arch: x64
            filename: 'UTMT_CLI_*-Ubuntu.zip'
          - rid: UndertaleModCli-Genouka
            os: macos
            arch: arm64
            filename: 'UTMT_CLI_*-macOS.zip'
          - rid: UndertaleModCli-Genouka
            os: macos
            arch: x64
            filename: 'UTMT_CLI_*-macOS-x86.zip'
          - rid: UndertaleModToolAndroid-Genouka
            os: android
            arch: arm64
            filename: 'UndertaleModToolAvalonia_*-Android-arm64-Signed.apk'
          - rid: UndertaleModToolAndroid-Genouka
            os: android
            arch: x64
            filename: 'UndertaleModToolAvalonia_*-Android-x64-Signed.apk'
          - rid: UndertaleModToolAndroidPreinstall-Genouka
            os: android
            arch: arm64
            filename: 'UndertaleModToolAvalonia_Android-arm64-Preinstall-Signed.apk'
          - rid: UndertaleModToolAndroidPreinstall-Genouka
            os: android
            arch: x64
            filename: 'UndertaleModToolAvalonia_Android-x64-Preinstall-Signed.apk'
    steps:
      - uses: MirrorChyan/uploading-action@v1
        with:
          filetype: latest-release
          filename: ${{ matrix.filename }}
          mirrorchyan_rid: ${{ matrix.rid }}
          tag: ${{ needs.resolve.outputs.tag }}
          channel: stable

          os: ${{ matrix.os }}
          arch: ${{ matrix.arch }}

          owner: Genouka
          repo: UndertaleModTool
          github_token: ${{ secrets.GITHUB_TOKEN }}
          upload_token: ${{ secrets.MirrorChyanUploadToken }}
