name: Publish stable release of UndertaleModTool

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 0.9.1.0)'
        required: true
        default: '0.9.1.0'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_gui:

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        configuration: [Release]
        bundled: [true]
        singlefile: [true, false]
        include:
          - singlefile: true
            filename: UndertaleModTool_${{ inputs.version }}-Windows-SingleFile
          - singlefile: false
            filename: UndertaleModTool_${{ inputs.version }}-Windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: |
        dotnet build UndertaleModTool --no-restore
        dotnet build UndertaleModToolUpdater --no-restore
    - name: Publish ${{ matrix.os }} GUI
      run: |
        dotnet publish UndertaleModTool -c ${{ matrix.configuration }} -r win-x64 --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=${{ matrix.singlefile }} --output ${{ matrix.os }}
        dotnet publish UndertaleModToolUpdater -c ${{ matrix.configuration }} -r win-x64 --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=false --output ${{ matrix.os }}/Updater
    - name: Copy external files
      run: |
        cp ./README.md ./${{ matrix.os }}
        cp ./SCRIPTS.md ./${{ matrix.os }}
        cp ./LICENSE.txt ./${{ matrix.os }}
        rm ./${{ matrix.os }}/Underanalyzer.pdb
    - name: Create zip for stable release Windows GUI
      run: |
        7z a -tzip ${{ matrix.filename }}.zip ./${{ matrix.os }}/* -mx9
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}.zip

  build_cli:

    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
        bundled: [true]
        target: [linux-x64, osx-arm64, osx-x64, win-x64]
        include:
          - target: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            output: CLI-ubuntu-latest
            filename: UTMT_CLI_${{ inputs.version }}-Ubuntu
          - target: osx-arm64
            os: macOS-latest
            rid: osx-arm64
            output: CLI-macOS-latest
            filename: UTMT_CLI_${{ inputs.version }}-macOS
          - target: osx-x64
            os: macOS-latest
            rid: osx-x64
            output: CLI-macOS-latest-x86
            filename: UTMT_CLI_${{ inputs.version }}-macOS-x86
          - target: win-x64
            os: windows-latest
            rid: win-x64
            output: CLI-windows-latest
            filename: UTMT_CLI_${{ inputs.version }}-Windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore UndertaleModCli
    - name: Build
      run: dotnet build UndertaleModCli --no-restore
    - name: Publish ${{ matrix.os }} CLI
      run: dotnet publish UndertaleModCli -c ${{ matrix.configuration }} -r ${{ matrix.rid }} --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=false --output ${{ matrix.output }}
    - name: Copy external files
      run: |
        cp ./README.md ./${{ matrix.output }}/
        cp ./SCRIPTS.md ./${{ matrix.output }}/
        cp ./LICENSE.txt ./${{ matrix.output }}/
        cp -r ./UndertaleModTool/Scripts/ ./${{ matrix.output }}/Scripts/
        rm ./${{ matrix.output }}/Underanalyzer.pdb
    - name: Create zip for stable release CLI
      run: |
        7z a -tzip ${{ matrix.filename }}.zip ./${{ matrix.output }}/* -mx9
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}.zip

  build_avalonia_gui:

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            filename: UndertaleModToolAvalonia_${{ inputs.version }}-Linux
          - rid: win-x64
            os: windows-latest
            filename: UndertaleModToolAvalonia_${{ inputs.version }}-Windows
          - rid: osx-arm64
            os: macOS-latest
            filename: UndertaleModToolAvalonia_${{ inputs.version }}-macOS
          - rid: osx-x64
            os: macOS-latest
            filename: UndertaleModToolAvalonia_${{ inputs.version }}-macOS-x86

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore UndertaleModToolAvalonia.Desktop
    - name: Publish ${{ matrix.rid }} Avalonia GUI
      run: |
        dotnet publish UndertaleModToolAvalonia.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ${{ matrix.filename }}
    - name: Copy external files
      run: |
        cp ./README.md ./${{ matrix.filename }}/
        cp ./SCRIPTS.md ./${{ matrix.filename }}/
        cp ./LICENSE.txt ./${{ matrix.filename }}/
        rm ./${{ matrix.filename }}/Underanalyzer.pdb
    - name: Create zip for stable release Avalonia GUI
      run: |
        7z a -tzip ${{ matrix.filename }}.zip ./${{ matrix.filename }}/* -mx9
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.filename }}
        path: ${{ matrix.filename }}.zip

  build_avalonia_android:

    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
        include:
          - rid: android-arm64
            filename: UndertaleModToolAvalonia_${{ inputs.version }}-Android-arm64
          - rid: android-x64
            filename: UndertaleModToolAvalonia_${{ inputs.version }}-Android-x64

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android workload
      run: dotnet workload install android
    - name: Publish Avalonia Android APK
      run: |
        dotnet publish UndertaleModToolAvalonia.Android -c Release -r ${{ matrix.rid }} --self-contained true -p:AndroidSdkDirectory="$env:ANDROID_HOME" --output ${{ github.workspace }}\Avalonia-Android-${{ matrix.rid }}
    - name: Copy external files
      shell: pwsh
      run: |
        Copy-Item -Path ./README.md, ./SCRIPTS.md, ./LICENSE.txt -Destination ./Avalonia-Android-${{ matrix.rid }}/
        Remove-Item -Path ./Avalonia-Android-${{ matrix.rid }}/Underanalyzer.pdb -ErrorAction SilentlyContinue
    - name: Create zip for stable release Avalonia Android
      shell: pwsh
      run: |
        # The APK stays inside the zip so the app can update itself on Android (it extracts the
        # APK from the downloaded build and hands it to the system package installer).
        7z a -tzip ${{ matrix.filename }}.zip ./Avalonia-Android-${{ matrix.rid }}/* -mx9
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.filename }}
        path: ${{ matrix.filename }}.zip

  upload:

    needs: [build_gui, build_cli, build_avalonia_gui, build_avalonia_android]
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8

    - name: Generate release body with build table
      run: |
        cat > release_body.md <<'EOF'
        This is an unofficial version of UndertaleModTool developed by 秋冥散雨_Genouka.

        If you encounter any bugs, please submit an issue to this repository on Github.

        If you're not sure which one to download, please download `UndertaleModTool_${{ inputs.version }}-Windows.zip`
        
        这是由 秋冥散雨_Genouka 开发的非官方版本的 UndertaleModTool。
        
        如果你遇到任何Bug ，请在Github 向此仓库提交 Issue 。
        
        如果你不清楚该下载哪个，请下载`UndertaleModTool_${{ inputs.version }}-Windows.zip`
        
        ## Available builds
        | Name | Platform | Type | Download |
        |------|----------|------|----------|
        EOF
        # 遍历所有下载的 .zip 文件，生成表格行
        for file in $(find . -name "*.zip" -type f); do
          name=$(basename "$file")
          # 提取平台与图标
          if [[ "$name" =~ Windows ]]; then
            icon="🪟"
            platform="Windows"
          elif [[ "$name" =~ Ubuntu ]] || [[ "$name" =~ Linux ]]; then
            icon="🐧"
            platform="Linux"
          elif [[ "$name" =~ macOS ]]; then
            icon="🍎"
            platform="macOS"
          elif [[ "$name" =~ Android ]]; then
            icon="📱"
            platform="Android"
          else
            icon="❓"
            platform="Unknown"
          fi
          # 提取版本类型
          if [[ "$name" =~ CLI ]]; then
            type="CLI"
          elif [[ "$name" =~ Avalonia ]]; then
            if [[ "$name" =~ Android ]]; then
              type="Avalonia Android"
            else
              type="Avalonia GUI"
            fi
          else
            type="GUI"
          fi
          echo "| $name | $icon $platform | $type | [Download](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version }}/$name) |" >> release_body.md
        done
        echo "" >> release_body.md
        echo "## Changelog" >> release_body.md
        echo "[View Changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)" >> release_body.md
      shell: bash

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.version }}
        name: Release ${{ inputs.version }}
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          */*
        body_path: release_body.md
