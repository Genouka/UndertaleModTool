name: Publish continuous release of UndertaleModTool

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'UndertaleModTool/Scripts/**'
      - 'README.md'
      - 'SCRIPTS.md'
      - 'SECURITY.md'
      - 'MCP.md'
      - 'images/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_gui:

    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        configuration: [Debug]
        bundled: [true]
        singlefile: [true, false]
        include:
          - singlefile: true
            filename: UndertaleModTool_nightly-Windows-SingleFile
          - singlefile: false
            filename: UndertaleModTool_nightly-Windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: |
        dotnet build UndertaleModTool --no-restore
        dotnet build UndertaleModToolUpdater --no-restore
    - name: Publish ${{ matrix.os }} GUI
      run: | # FIXME: debug constant isn't being applied here, which disables updater, etc., so need to fix that or possibly add a new constant
        dotnet publish UndertaleModTool -c ${{ matrix.configuration }} -r win-x64 -p:DefineConstants="SHOW_COMMIT_HASH" --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=${{ matrix.singlefile }} --output ${{ matrix.os }}
        dotnet publish UndertaleModToolUpdater -c ${{ matrix.configuration }} -r win-x64 --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=false --output ${{ matrix.os }}/Updater
    - name: Copy external files
      run: |
        cp ./README.md ./${{ matrix.os }}
        cp ./SCRIPTS.md ./${{ matrix.os }}
        cp ./LICENSE.txt ./${{ matrix.os }}
        rm ./${{ matrix.os }}/Underanalyzer.pdb
    - name: Create zip for nightly release Windows GUI
      run: |
        7z a -tzip ${{ matrix.filename }}.zip ./${{ matrix.os }}/* -mx0 
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}.zip

  build_cli:

    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug]
        bundled: [true]
        target: [linux-x64, osx-arm64, osx-x64, win-x64]
        include:
          - target: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            output: CLI-ubuntu-latest
            filename: UTMT_CLI_nightly-Ubuntu
          - target: osx-arm64
            os: macOS-latest
            rid: osx-arm64
            output: CLI-macOS-latest
            filename: UTMT_CLI_nightly-macOS
          - target: osx-x64
            os: macOS-latest
            rid: osx-x64
            output: CLI-macOS-latest-x86
            filename: UTMT_CLI_nightly-macOS-x86
          - target: win-x64
            os: windows-latest
            rid: win-x64
            output: CLI-windows-latest
            filename: UTMT_CLI_nightly-Windows

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore UndertaleModCli
    - name: Build
      run: dotnet build UndertaleModCli --no-restore
    - name: Publish ${{ matrix.os }} CLI
      run: dotnet publish UndertaleModCli -c ${{ matrix.configuration }} -r ${{ matrix.rid }} --self-contained ${{ matrix.bundled }} -p:PublishSingleFile=false --output ${{ matrix.output }}
    - name: Copy external files
      run: |
        cp ./README.md ./${{ matrix.output }}/
        cp ./SCRIPTS.md ./${{ matrix.output }}/
        cp ./LICENSE.txt ./${{ matrix.output }}/
        cp -r ./UndertaleModTool/Scripts/ ./${{ matrix.output }}/Scripts/
        rm ./${{ matrix.output }}/Underanalyzer.pdb
    - name: Create zip for nightly release CLI
      run: |
        7z a -tzip ${{ matrix.filename }}.zip ./${{ matrix.output }}/* -mx0 
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}.zip

  build_avalonia_gui:

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-latest
            filename: UndertaleModToolAvalonia_nightly-Linux
          - rid: win-x64
            os: windows-latest
            filename: UndertaleModToolAvalonia_nightly-Windows
          - rid: osx-arm64
            os: macOS-latest
            filename: UndertaleModToolAvalonia_nightly-macOS
          - rid: osx-x64
            os: macOS-latest
            filename: UndertaleModToolAvalonia_nightly-macOS-x86

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore UndertaleModToolAvalonia.Desktop
    - name: Publish ${{ matrix.rid }} Avalonia GUI
      run: |
        dotnet publish UndertaleModToolAvalonia.Desktop -c Debug -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true --output ${{ matrix.filename }}
    - name: Copy external files
      run: |
        cp ./README.md ./${{ matrix.filename }}/
        cp ./SCRIPTS.md ./${{ matrix.filename }}/
        cp ./LICENSE.txt ./${{ matrix.filename }}/
        rm ./${{ matrix.filename }}/Underanalyzer.pdb
    - name: Create zip for nightly release Avalonia GUI
      run: |
        7z a -tzip ${{ matrix.filename }}.zip ./${{ matrix.filename }}/* -mx0
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.filename }}
        path: ${{ matrix.filename }}.zip

  build_avalonia_android:

    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
        include:
          - rid: android-arm64
            arch: arm64
            filename: UndertaleModToolAvalonia_nightly-Android-arm64
          - rid: android-x64
            arch: x64
            filename: UndertaleModToolAvalonia_nightly-Android-x64

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Install Android workload
      run: dotnet workload install android
    - name: Restore fixed signing key from secrets
      env:
        ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      shell: bash
      run: |
        # Both APKs built below (the app and the Android 10 preinstall helper) share one
        # application id, so the system only accepts installing either over the other when both
        # carry the same signature - and a fresh runner would otherwise generate a throwaway
        # debug keystore on every run. The fixed release keystore lives base64-encoded in the
        # ANDROID_KEYSTORE_BASE64 repo secret and is materialised into $RUNNER_TEMP, never into
        # the workspace, so it cannot end up inside any zip or artifact. The password reaches
        # MSBuild as an environment variable (mapped to the signing properties in
        # build/AndroidApp.props) and is never echoed or placed on a command line.
        if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
          echo "::warning::Secret ANDROID_KEYSTORE_BASE64 is not configured - falling back to a throwaway auto-generated debug keystore. These builds will not install over officially signed ones."
          exit 0
        fi
        keystore="${RUNNER_TEMP//\\//}/qiuutmtv5-android-release.keystore"
        printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$keystore"
        {
          echo "UMT_ANDROID_KEYSTORE_PATH=$keystore"
          echo "UMT_ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS"
          echo "UMT_ANDROID_KEY_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
        } >> "$GITHUB_ENV"
    - name: Publish Avalonia Android APK
      run: |
        dotnet publish UndertaleModToolAvalonia.Android -c Debug -r ${{ matrix.rid }} --self-contained true -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:AndroidPreinstallChannel=nightly --output ${{ github.workspace }}\Avalonia-Android-${{ matrix.rid }}
    - name: Publish Android storage setup (preinstall) APK
      # Android 10 only: the real APK targets a far newer API level, so granting the storage
      # permission there is worthless without the legacy storage model - which Android 10 only keeps
      # for a package that is *updated* from a build that already had it. This tiny targetSdk 29 APK
      # is that build. It is published next to the real APK and installed first, then replaced by it.
      #
      # It has to be built in the same job as the real APK: both share an application id and are
      # installed over each other, so the system requires one and the same signing key for both.
      run: |
        dotnet publish UndertaleModToolAvalonia.AndroidPreinstall -c Debug -r ${{ matrix.rid }} --self-contained true -p:AndroidSdkDirectory="$env:ANDROID_HOME" -p:AndroidPreinstallChannel=nightly --output ${{ github.workspace }}\Avalonia-Android-Preinstall-${{ matrix.rid }}
    - name: Copy external files
      shell: pwsh
      run: |
        Copy-Item -Path ./README.md, ./SCRIPTS.md, ./LICENSE.txt -Destination ./Avalonia-Android-${{ matrix.rid }}/
        Remove-Item -Path ./Avalonia-Android-${{ matrix.rid }}/Underanalyzer.pdb -ErrorAction SilentlyContinue
    - name: Create zip for nightly release Avalonia Android
      shell: pwsh
      run: |
        # The APK stays inside the zip so the app can update itself on Android (it extracts the
        # APK from the downloaded build and hands it to the system package installer).
        7z a -tzip ${{ matrix.filename }}.zip ./Avalonia-Android-${{ matrix.rid }}/* -mx0
        # The signed APK is published on its own as well: it installs directly without unzipping,
        # so the release table links it instead of the zip.
        Copy-Item (Get-Item "./Avalonia-Android-${{ matrix.rid }}/*-Signed.apk").FullName "./${{ matrix.filename }}-Signed.apk"
        # The storage setup APK is a separate asset and has to be installed *before* the APK above.
        # Its name carries no version or channel on purpose, so the app can link it on both channels.
        Copy-Item (Get-Item "./Avalonia-Android-Preinstall-${{ matrix.rid }}/*-Signed.apk").FullName "./UndertaleModToolAvalonia_Android-${{ matrix.arch }}-Preinstall-Signed.apk"
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.filename }}
        path: |
          ${{ matrix.filename }}.zip
          ${{ matrix.filename }}-Signed.apk
          UndertaleModToolAvalonia_Android-${{ matrix.arch }}-Preinstall-Signed.apk

  upload:

    needs: [build_gui, build_cli, build_avalonia_gui, build_avalonia_android]
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8

    - name: Delete old nightly release (if exists)
      run: |
        gh release delete nightly --cleanup-tag --yes || true
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}

    - name: Generate release body with build table
      run: |
        cat > release_body.md <<'EOF'
        This is an unofficial version of UndertaleModTool developed by 秋冥散雨_Genouka.

        If you encounter any bugs, please submit an issue to this repository on Github.

        If you're not sure which one to download, please download `UndertaleModTool_nightly-Windows.zip`
        
        这是由 秋冥散雨_Genouka 开发的非官方版本的 UndertaleModTool。
        
        如果你遇到任何Bug ，请在Github 向此仓库提交 Issue 。
        
        如果你不清楚该下载哪个，请下载`UndertaleModTool_nightly-Windows.zip`
        
        EOF
        {
          echo ''
          echo '## Available builds'
          echo ''
        } >> release_body.md

        # 按平台分组：每个平台一张表、架构分别列出，不再用 find 的随机顺序。
        tmp=$(mktemp -d)
        folded="$tmp/avalonia-windows"
        : > "$folded"

        # Android 同时产出 zip 与已签名的 APK：表格给可直接安装的 APK，zip 仍作为发行资产保留
        # （应用内更新会下载 zip 并从中取出 APK）。先记下哪些架构有 APK。
        # 前置（storage setup）APK 不参与这个判断：它是给 Android 10 单独安装的辅助包。
        apk_arches=""
        for apk in $(find . -name "*-Signed.apk" -type f ! -name "*Preinstall*"); do
          case "$(basename "$apk")" in
            *-arm64*) apk_arches="$apk_arches arm64" ;;
            *)        apk_arches="$apk_arches x64" ;;
          esac
        done

        for file in $(find . \( -name "*.zip" -o -name "*-Signed.apk" \) -type f); do
          name=$(basename "$file")
          kind="zip"
          case "$name" in
            *.apk) kind="apk" ;;
          esac
          url="https://github.com/${{ github.repository }}/releases/download/nightly/$name"

          # 平台（决定分组与标题图标）
          case "$name" in
            *Android*)         platform=android; icon="📱"; label="Android" ;;
            *Ubuntu*|*Linux*)  platform=linux;   icon="🐧"; label="Linux" ;;
            *macOS*)           platform=macos;   icon="🍎"; label="macOS" ;;
            *Windows*)         platform=windows; icon="🪟"; label="Windows" ;;
            *)                 platform=unknown; icon="❓"; label="Unknown" ;;
          esac

          # 类型；type_rank 决定同一张表内的行序（GUI -> CLI -> Avalonia -> Android 10 前置包）
          case "$name" in
            *Preinstall*)        type="Android 10 storage setup"; type_rank=4 ;;
            *UTMT_CLI_*)         type="CLI";              type_rank=2 ;;
            *Avalonia*Android*)  type="Avalonia Android"; type_rank=3 ;;
            *Avalonia*)          type="Avalonia GUI";     type_rank=3 ;;
            *)                   type="GUI";              type_rank=1 ;;
          esac
          if [ "$type" = "GUI" ]; then
            case "$name" in
              *SingleFile*) type="GUI (single file)" ;;
              *)            type="**GUI (recommended)**" ;;
            esac
          fi

          # 架构；arch_rank 让 arm64 排在 x64 前面。注意 macOS 的产物名不带架构后缀时就是
          # Apple Silicon 版，只有 -x86/-x64 才是 Intel 版（见上面各 job 的 matrix）。
          case "$platform" in
            macos)
              case "$name" in
                *-x86*|*-x64*) arch="x64";   arch_rank=2 ;;
                *)             arch="arm64"; arch_rank=1 ;;
              esac
              if [ "$arch" = "arm64" ]; then arch="arm64 (Apple Silicon)"; else arch="x64 (Intel)"; fi ;;
            android)
              case "$name" in
                *-arm64*) arch_raw="arm64" ;;
                *)        arch_raw="x64" ;;
              esac
              if [ "$arch_raw" = "arm64" ]; then arch="arm64 (most phones)"; arch_rank=1; else arch="x64 (emulators)"; arch_rank=2; fi ;;
            *)
              arch="x64"; arch_rank=2 ;;
          esac

          # Android 已有同架构 APK 时不再单列 zip 行
          if [ "$platform" = "android" ] && [ "$kind" != "apk" ]; then
            case " $apk_arches " in
              *" $arch_raw "*) continue ;;
            esac
          fi

          rank=$((type_rank * 10 + arch_rank))
          row="$rank | $type | $arch | \`$name\` | [Download]($url) |"
          if [ "$platform" = "windows" ] && [ "$type" = "Avalonia GUI" ]; then
            # Windows 上的 Avalonia 版不常见，折叠到 Windows 表下方
            echo "$row" >> "$folded"
          else
            echo "$row" >> "$tmp/$platform"
          fi
        done

        for platform in windows linux macos android unknown; do
          [ -s "$tmp/$platform" ] || continue
          case "$platform" in
            windows) icon="🪟"; label="Windows" ;;
            linux)   icon="🐧"; label="Linux" ;;
            macos)   icon="🍎"; label="macOS" ;;
            android) icon="📱"; label="Android" ;;
            *)       icon="❓"; label="Unknown" ;;
          esac

          {
            echo "### $icon $label"
            echo ''
            echo '| Type | Arch | Build | Download |'
            echo '|------|------|-------|----------|'
            sort -k1,1n "$tmp/$platform" | sed 's/^[0-9]* //'
            echo ''
          } >> release_body.md

          # Android 10 需要先装前置包才能拿到存储权限，光看表格不知道哪个先装，这里补一句说明
          if [ "$platform" = "android" ]; then
            {
              echo '> **Android 10 users / Android 10 用户：** if the app cannot access storage, install the `*-Preinstall-Signed.apk` for your device **first**, open it and grant the storage permission, then install the app APK **on top of it** (no uninstall needed). / 若应用无法读写存储，请先安装对应架构的 `*-Preinstall-Signed.apk` 前置包，打开并允许存储权限，再直接覆盖安装正式版 APK（不需要卸载）。'
              echo ''
            } >> release_body.md
          fi

          if [ "$platform" = "windows" ] && [ -s "$folded" ]; then
            {
              echo '<details>'
              echo "<summary>$icon $label · Avalonia GUI (x64) — 不常见，点击展开 / uncommon, click to expand</summary>"
              echo ''
              echo '| Type | Arch | Build | Download |'
              echo '|------|------|-------|----------|'
              sort -k1,1n "$folded" | sed 's/^[0-9]* //'
              echo ''
              echo '</details>'
              echo ''
            } >> release_body.md
          fi
        done
      shell: bash

    - name: Find previous stable release tag
      id: previous
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        # nightly 的 tag 每次都会被删掉重建，GitHub 也可能拿上一个 nightly 当基准；这里固定
        # 取最近一个稳定版 release，让 nightly 的 Changelog 覆盖上一个稳定版以来的全部提交。
        tag=$(gh release list --limit 100 --json tagName,isPrerelease,publishedAt \
          --jq '[.[] | select(.isPrerelease | not)]
                | sort_by(.publishedAt) | reverse | .[0].tagName // ""')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "previous stable release: ${tag:-<none>}"
      shell: bash

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: nightly
        name: Nightly Build - ${{ github.sha }}
        prerelease: true
        fail_on_unmatched_files: true
        files: |
          */*
        body_path: release_body.md
        # 由 GitHub 自动生成的发行说明会追加在上面的正文之后，Changelog 由此填充
        # （仓库中并没有 CHANGELOG.md，原先那个链接是失效的）。
        generate_release_notes: true
        previous_tag: ${{ steps.previous.outputs.tag }}
