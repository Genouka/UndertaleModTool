name: Bug Report
description: Something not behaving the way it should? Let us know!
labels: ["bug"]
body:
- type: dropdown
  attributes:
    label: Platform
    description: Which platform/version of UndertaleModTool does the bug occur on?
    multiple: true
    options:
      - WPF-Windows
      - Avalonia-Windows
      - Avalonia-Linux
      - Avalonia-MacOS (ARM64)
      - Avalonia-MacOS (Intel)
      - Avalonia-Android (ARM64)
      - Avalonia-Android (x64)
      - QiuUTMTv5 API
      - CLI
      - Other
  validations:
    required: true
- type: textarea
  attributes:
    label: Describe the bug
    description: A clear description of what the bug is. Please consider adding pictures and/or videos, as they really help! Use English or Chinese only!
    placeholder: |
      When doing X, UndertaleModTool crashes.
  validations:
    required: true
- type: textarea
  attributes:
    label: Reproducing steps
    description: Steps to reproduce the behavior.
    placeholder: |
      1. Open X ...
      2. Do Y ...
      3. See error
  validations:
    required: true
- type: textarea
  attributes:
    label: Setup Details
    description: A clear and concise description of your tools and enviroment used.
    placeholder: |
      1. UndertaleModTool version: What UndertaleModTool version did you use? If compiled from source, please specify the commit number.
      2. Operating system: Specify the OS and version e.g. Windows 10, Mac OS X Catalina, Ubuntu 20.04, etc.
      3. GameMaker Game: What GameMaker game was used? Link to it!
  validations:
    required: true
- type: checkboxes
  attributes:
    label: Requirements
    description: Check all the things below.
    options:
      - label: I have confirmed that this issue has not been raised before.
        required: true
      - label: I have confirmed that this issue is written in English or Chinese.
        required: true
      - label: I have confirmed that I have tried the latest version.
        required: true
- type: markdown
  attributes:
    value: "If there are multiple issues, please raise them as separate issues."