<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UndertaleModTool 分支文档</title>
  <meta name="description" content="Genouka 版 UndertaleModTool 的中文文档：跨平台 GUI、代码编辑器、资源工具、Butterscotch 调试器与 MCP 服务器。">
  <meta name="theme-color" content="#171a2b">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/lib/docsify-vue.css">
  <link rel="stylesheet" href="assets/lib/prism/prism.css">
  <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>
  <div id="app">正在加载文档…</div>

  <script>
    window.$docsify = {
      name: 'UndertaleModTool',
      repo: 'https://github.com/Genouka/UndertaleModTool',
      logo: 'assets/img/logo.png',
      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      auto2top: true,
      homepage: 'README.md',
      relativePath: false,
      search: {
        placeholder: '搜索文档…',
        noData: '没有找到相关内容',
        depth: 4,
        paths: 'auto'
      },
      zoomImage: {
        background: 'rgba(13, 16, 28, 0.88)'
      }
    };
  </script>

  <script src="assets/js/copy-code.js?v=5"></script>
  <script src="assets/lib/docsify.min.js"></script>

  <script src="assets/lib/zoom-image.min.js"></script>
  <script src="assets/lib/prism/prism-gml.min.js"></script>
  <script src="assets/lib/prism/prism-csharp.min.js"></script>
  <script src="assets/lib/prism/prism-json.min.js"></script>
